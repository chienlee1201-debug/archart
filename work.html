<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作品｜Arch</title>
<meta name="description" content="Arch 畫家的原創作品。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="work">
<a class="skip" href="#main">跳到主要內容</a>

<script src="js/site-chrome.js"></script>

<main id="main">
<!-- 資料：依網址 ?id= 讀取作品（只顯示已上架畫家的作品），由 js/work.js 填入 data-slot。
     data-state：loading 載入中／ready 顯示內容／missing 找不到這件作品／error 讀取失敗，一次只顯示一個 -->

<!-- 載入中 -->
<section class="band band--tight" data-state="loading">
  <div class="shell">
    <div class="work-detail skel" aria-hidden="true">
      <div class="ph"></div>
      <div><span class="skel-line skel-line--short"></span><span class="skel-line skel-line--title"></span><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--mid"></span></div>
    </div>
    <p class="visually-hidden" role="status">正在載入作品…</p>
  </div>
</section>

<!-- 找不到這件作品（沒有 id、id 打錯、作品已下架） -->
<section class="band" data-state="missing" hidden>
  <div class="shell not-found">
    <h1>找不到這件作品</h1>
    <p>可能是網址打錯了，或這件作品暫時沒有公開。可以到「找畫家」看看其他作品。</p>
    <div class="btn-row"><a class="btn" href="artists.html?view=works">看全部作品</a><a class="btn btn--ghost" href="artists.html">去找畫家</a></div>
  </div>
</section>

<!-- 讀取失敗 -->
<section class="band" data-state="error" hidden>
  <div class="shell not-found" role="alert">
    <h1>作品資料沒有順利載入</h1>
    <p data-slot="error-msg">請檢查網路後再試一次。</p>
    <div class="btn-row"><button class="btn" type="button" data-action="reload">重新整理</button><a class="btn btn--ghost" href="artists.html?view=works">看全部作品</a></div>
  </div>
</section>

<div data-state="ready" hidden>
<section class="band band--tight">
  <div class="shell">
    <ol class="crumbs">
      <li><a href="artists.html">找畫家</a></li>
      <li><a href="#" data-slot="crumb-artist"></a></li>
      <li aria-current="page" data-slot="crumb"></li>
    </ol>

    <div class="work-detail">
      <figure class="work-figure" data-slot="figure"></figure>

      <div class="work-info">
        <span class="status" data-slot="status"></span>
        <h1 style="margin-top:.75rem" data-slot="title"></h1>
        <a class="work-by" href="#" data-slot="by"><span class="avatar avatar--sm" data-slot="by-avatar" data-avatar aria-hidden="true"></span><span data-slot="by-name"></span></a>

        <p class="work-price" data-slot="price"></p>

        <dl class="specs" data-slot="specs"></dl>

        <p class="work-desc" data-slot="desc"></p>

        <div class="btn-row" style="margin-top:1.5rem">
          <!-- 詢問功能上線時移除下一行的 hidden（下面那行「畫家會用 Email 回覆你」也一起） -->
          <button class="btn" type="button" data-open="inquiry-dialog" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>詢問這件作品</button>
          <button class="fav-btn" type="button" aria-pressed="false" aria-label="收藏這件作品" data-slot="fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg></button>
        </div>
        <p class="muted small" style="margin-top:1rem" hidden>畫家會用 Email 回覆你，交易在平台外完成。</p>
      </div>
    </div>
  </div>
</section>

<section class="band band--alt" aria-labelledby="t-more" data-slot="more-section">
  <div class="shell">
    <div class="sec-head">
      <h2 id="t-more" data-slot="more-title">這位畫家的其他作品</h2>
      <a class="more-link" href="#" data-slot="more-link">看畫家頁 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
    <div class="grid grid--works" data-slot="more"></div>
  </div>
</section>
</div>

<!-- 詢問對話框：訪客按下時先導向 login.html，登入後回到這頁 -->
<dialog class="dialog" id="inquiry-dialog" aria-labelledby="inq-title">
  <form class="inquiry-form" novalidate>
    <div class="dialog-head">
      <h2 id="inq-title">詢問 <span data-slot="inq-name">畫家</span></h2>
      <button class="close-btn" type="button" data-close aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="dialog-body">
      <p class="muted small" data-slot="inq-about"></p>
      <div class="field">
        <label class="q" for="inq-msg">你想問什麼？<span class="req" aria-hidden="true"> *</span></label>
        <span class="hint">例如：尺寸、能不能客製、大概多久可以完成、怎麼寄送。</span>
        <textarea class="ctrl" id="inq-msg" name="message" rows="5" required></textarea>
        <p class="err" role="alert">請寫下你想問的內容。</p>
      </div>
      <div class="notice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <p>畫家會回信到你登入的 Google 信箱 <strong data-slot="me-email">you@gmail.com</strong>。之後的討論與交易在平台外進行。</p>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn--ghost" type="button" data-close>取消</button>
      <button class="btn" type="submit">送出詢問</button>
    </div>
  </form>
</dialog>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/images.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/cards.js"></script>
<script src="js/work.js"></script>
</body>
</html>
