<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>成為畫家｜Arch</title>
<meta name="description" content="申請成為 Arch 畫家，免費建立你的畫家頁。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="apply">
<a class="skip" href="#main">跳到主要內容</a>

<script src="js/site-chrome.js"></script>

<main id="main">
<!-- 需要登入；未登入時先導向 login.html，登入後回到這頁 -->
<section class="band band--tight">
  <div class="shell shell--sm">
    <div class="page-head">
      <div>
        <p class="eyebrow">免費加入</p>
        <h1>成為 Arch 畫家</h1>
        <p class="lede">登入後填寫你的畫家資料與作品，可以先存草稿慢慢填。送出後我們會確認內容，通過就會出現在網站上。</p>
      </div>
    </div>

    <form class="form-card" id="apply-form" action="studio.html" novalidate>
      <fieldset class="field">
        <legend class="q">你從哪裡知道 Arch？（選填）</legend>
        <div class="opts">
          <label class="opt"><input type="radio" name="referral_source" value="threads"><span>Threads</span></label>
          <label class="opt"><input type="radio" name="referral_source" value="instagram"><span>Instagram</span></label>
          <label class="opt"><input type="radio" name="referral_source" value="friend"><span>朋友介紹</span></label>
          <label class="opt"><input type="radio" name="referral_source" value="other"><span>其他</span></label>
        </div>
      </fieldset>
      <div class="field" id="original-field">
        <label class="check"><input type="checkbox" id="original" name="original" required aria-describedby="original-err"><span>我確認上傳的作品都是我本人的原創作品，並同意作品與資料公開展示在 Arch。</span></label>
        <p class="err" id="original-err" role="alert">請先勾選這一項，才能開始填寫畫家資料。</p>
      </div>
      <div class="form-actions">
        <span class="muted">已登入：<span data-slot="me-email">you@gmail.com</span></span>
        <button class="btn" type="submit">下一步：填寫畫家資料 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </form>

    <div class="sec-head" style="margin-top:3rem"><h2 style="font-size:1.25rem">審核看什麼？</h2></div>
    <p class="muted">我們不評判作品好不好，只確認幾件事：</p>
    <ul class="auth-perks" style="border:0;padding:0">
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>作品是你本人的原創</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>你有持續在創作</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>作品資訊完整（圖片、媒材、尺寸、價格）</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>符合平台規範（非 AI 生成、非盜圖、非大量複製的裝飾畫）</li>
    </ul>
  </div>
</section>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
/* 申請成為畫家：勾了原創聲明才前往畫家後台（studio.html）填資料；沒勾就顯示提示 */
(function(){
  var form = document.getElementById("apply-form");
  var box = document.getElementById("original");
  var field = document.getElementById("original-field");
  if(!form || !box || !field) return;
  box.addEventListener("change", function(){ if(box.checked) field.classList.remove("is-invalid"); });
  form.addEventListener("submit", function(e){
    e.preventDefault();
    if(!box.checked){
      field.classList.add("is-invalid");
      box.focus();
      return;
    }
    // TODO 接上資料庫後：把選到的來源（referral_source：threads／instagram／friend／other，可空）
    //      存進這位畫家的草稿資料，再前往畫家後台
    // var picked = form.querySelector('input[name="referral_source"]:checked');
    location.href = "studio.html";
  });
})();
</script>
</body>
</html>
