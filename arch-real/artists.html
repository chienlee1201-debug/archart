<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>找畫家｜Arch</title>
<meta name="description" content="依風格、媒材、價格與是否接受客製，找到喜歡的台灣獨立畫家與原作。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="artists">
<a class="skip" href="#main">跳到主要內容</a>

<script src="js/site-chrome.js"></script>

<main id="main">
<section class="band band--tight">
  <div class="shell">
    <div class="page-head">
      <div>
        <h1>找畫家</h1>
        <p class="lede">依風格、媒材、價格找到喜歡的畫家，或直接逛作品。</p>
      </div>
      <!-- 切換：看畫家 ／ 看作品（?view=works） -->
      <nav class="seg" aria-label="瀏覽方式">
        <a href="artists.html" data-seg="artists" aria-current="true">看畫家</a>
        <a href="artists.html?view=works" data-seg="works">看作品</a>
      </nav>
    </div>

    <form class="filters" id="search" role="search">
      <div class="search-ctrl-wrap">
        <label class="q" for="f-q">搜尋</label>
        <div class="search-ctrl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="ctrl" type="search" id="f-q" name="q" placeholder="畫家名字、作品名稱、關鍵字" disabled></div>
      </div>
      <div>
        <label class="q" for="f-style">風格</label>
        <select class="ctrl" id="f-style" name="style" disabled>
          <option value="">全部風格</option>
          <option>寫實</option><option>抽象</option><option>插畫</option><option>風景</option><option>人物</option><option>寵物</option><option>靜物</option>
        </select>
      </div>
      <div>
        <label class="q" for="f-medium">媒材</label>
        <select class="ctrl" id="f-medium" name="medium" disabled>
          <option value="">全部媒材</option>
          <option>油畫</option><option>壓克力</option><option>水彩</option><option>膠彩</option><option>水墨</option><option>色鉛筆</option><option>粉彩</option><option>素描</option><option>版畫</option><option>複合媒材</option><option>電繪</option><option>其他</option>
        </select>
      </div>
      <div>
        <label class="q" for="f-price">價格</label>
        <select class="ctrl" id="f-price" name="price" disabled>
          <option value="">不限</option>
          <option value="0-5000">NT$ 5,000 以下</option>
          <option value="5000-15000">NT$ 5,000–15,000</option>
          <option value="15000-30000">NT$ 15,000–30,000</option>
          <option value="30000-">NT$ 30,000 以上</option>
        </select>
      </div>
      <label class="check"><input type="checkbox" name="custom" value="1" disabled><span>只看接受客製</span></label>
    </form>
    <!-- 篩選與搜尋在階段 3 實作；先停用並寫清楚，免得使用者以為壞掉 -->
    <p class="filters-note">搜尋和篩選功能準備中，目前先列出全部畫家與作品。</p>

    <div class="result-bar">
      <p>共 <strong data-slot="count">–</strong> <span data-slot="unit">位畫家</span></p>
      <label class="visually-hidden" for="f-sort">排序</label>
      <select class="ctrl" id="f-sort" name="sort" style="width:auto" disabled>
        <option>推薦排序</option><option>最新加入</option><option>價格低到高</option><option>價格高到低</option>
      </select>
    </div>

    <!-- 看畫家：由 js/artists.js 從資料庫（public_artists）填入；載入前先顯示骨架 -->
    <div class="grid" data-view="artists" aria-busy="true">
        <div class="card artist-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
        <div class="card artist-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
        <div class="card artist-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
        <div class="card artist-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
        <div class="card artist-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
        <div class="card artist-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
    </div>

    <!-- 看作品（?view=works 時顯示） -->
    <div class="grid grid--works" data-view="works" aria-busy="true" hidden>
        <div class="card work-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
        <div class="card work-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
        <div class="card work-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
        <div class="card work-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
        <div class="card work-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
        <div class="card work-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
        <div class="card work-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
        <div class="card work-card skel"><div class="ph"></div><div class="card-body"><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span></div></div>
    </div>

    <p class="visually-hidden" role="status" data-slot="live">正在載入…</p>
  </div>
</section>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/cards.js"></script>
<script src="js/artists.js"></script>
</body>
</html>
