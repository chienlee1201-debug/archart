<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>畫家｜Arch</title>
<meta name="description" content="Arch 畫家的創作故事與作品。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="artist">
<a class="skip" href="#main">跳到主要內容</a>

<script src="js/site-chrome.js"></script>

<main id="main">
<!-- 資料：依網址 ?slug= 讀取該畫家（只顯示已上架），由 js/artist.js 填入 data-slot。
     data-state：loading 載入中／ready 顯示內容／missing 找不到這位畫家／error 讀取失敗，一次只顯示一個 -->

<!-- 載入中（骨架：左欄畫家資料＋右欄作品卡） -->
<section class="band band--tight artist-page" data-state="loading">
  <div class="shell">
    <div class="artist-layout skel" aria-hidden="true">
      <div class="artist-side">
        <span class="artist-portrait"><span class="avatar"></span></span>
        <span class="skel-line skel-line--title"></span><span class="skel-line skel-line--mid"></span><span class="skel-line skel-line--short"></span>
      </div>
      <div class="aw-grid">
        <div class="aw-card"><span class="aw-art skel-block"></span><span class="skel-line skel-line--mid"></span><span class="skel-line"></span></div>
        <div class="aw-card"><span class="aw-art skel-block"></span><span class="skel-line skel-line--mid"></span><span class="skel-line"></span></div>
        <div class="aw-card"><span class="aw-art skel-block"></span><span class="skel-line skel-line--mid"></span><span class="skel-line"></span></div>
      </div>
    </div>
    <p class="visually-hidden" role="status">正在載入畫家資料…</p>
  </div>
</section>

<!-- 找不到這位畫家（沒有 slug、slug 打錯、畫家沒有上架） -->
<section class="band" data-state="missing" hidden>
  <div class="shell not-found">
    <h1>找不到這位畫家</h1>
    <p>可能是網址打錯了，或這位畫家的頁面暫時沒有公開。可以到「找畫家」看看其他畫家。</p>
    <div class="btn-row"><a class="btn" href="artists.html">去找畫家</a><a class="btn btn--ghost" href="index.html">回首頁</a></div>
  </div>
</section>

<!-- 讀取失敗 -->
<section class="band" data-state="error" hidden>
  <div class="shell not-found" role="alert">
    <h1>畫家資料沒有順利載入</h1>
    <p data-slot="error-msg">請檢查網路後再試一次。</p>
    <div class="btn-row"><button class="btn" type="button" data-action="reload">重新整理</button><a class="btn btn--ghost" href="artists.html">去找畫家</a></div>
  </div>
</section>

<!-- 版面照 demo（arch-site 畫家個別頁）：桌機左欄畫家資料、右欄作品；900px 以下改成上下排 -->
<div data-state="ready" hidden>
<section class="band band--tight artist-page">
  <div class="shell">
    <nav aria-label="目前位置">
      <ol class="crumbs artist-crumbs">
        <li><a class="crumb-back" href="artists.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>所有畫家</a></li>
        <li aria-current="page" data-slot="crumb"></li>
      </ol>
    </nav>

    <div class="artist-layout">
      <!-- 左欄：頭像 → 名字 → 位置 → 標籤 → 客製委託 → 一句話 → 聯絡 → 創作故事 -->
      <div class="artist-side">
        <span class="artist-portrait"><span class="avatar" data-slot="avatar" data-avatar aria-hidden="true"></span></span>
        <h1 class="artist-name" data-slot="name"></h1>
        <!-- 我的位置（有填才顯示） -->
        <p class="artist-loc" data-slot="location-box" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span class="visually-hidden">所在地：</span><span data-slot="location"></span></p>
        <div data-slot="tags"></div>
        <p class="badge artist-badge" data-slot="custom-badge" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5"/></svg>接受客製委託</p>
        <p class="artist-note" data-slot="custom-note"></p>
        <p class="artist-one" data-slot="tagline"></p>

        <div class="artist-contact" data-slot="contact">
          <p class="artist-contact-label" data-slot="contact-label"></p>
          <div class="btn-row" data-slot="links"></div>
        </div>

        <div class="artist-story" data-slot="story-box">
          <h2 class="visually-hidden">創作故事</h2>
          <p class="story" id="artist-story" data-slot="story"></p>
          <button class="story-toggle" type="button" data-slot="story-toggle" aria-controls="artist-story" aria-expanded="false" hidden>展開完整故事</button>
        </div>
      </div>

      <!-- 右欄：作品；整張卡片可點，進作品頁 -->
      <section class="artist-works" aria-labelledby="t-works">
        <h2 class="visually-hidden" id="t-works">作品<span data-slot="work-count"></span></h2>
        <div class="aw-grid" data-slot="works"></div>
      </section>
    </div>
  </div>
</section>
</div>

<!-- 詢問對話框：階段 3（詢問功能）用。版面改成 demo 樣式後頁面上暫時沒有開啟按鈕，階段 3 決定按鈕位置後再接上 -->
<dialog class="dialog" id="inquiry-dialog" aria-labelledby="inq-title">
  <form class="inquiry-form" novalidate>
    <div class="dialog-head">
      <h2 id="inq-title">詢問 <span data-slot="inq-name">畫家</span></h2>
      <button class="close-btn" type="button" data-close aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="dialog-body">
      <p class="muted small"></p>
      <div class="field">
        <label class="q" for="inq-msg">你想問什麼？<span class="req" aria-hidden="true"> *</span></label>
        <span class="hint">例如：尺寸、能不能客製、大概多久可以完成、怎麼寄送。</span>
        <textarea class="ctrl" id="inq-msg" name="message" rows="5" required></textarea>
        <p class="err" role="alert">請寫下你想問的內容。</p>
      </div>
      <div class="notice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <p>畫家會回信到你登入的 Google 信箱 <strong data-slot="me-email">you@gmail.com</strong>。之後的討論與交易在平台外進行。</p>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn--ghost" type="button" data-close>取消</button>
      <button class="btn" type="submit">送出詢問</button>
    </div>
  </form>
</dialog>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/images.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/cards.js"></script>
<script src="js/artist.js"></script>
</body>
</html>
