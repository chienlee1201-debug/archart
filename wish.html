<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>願望｜許願牆｜Arch</title>
<meta name="description" content="許願牆上的一個願望，以及畫家們的提案。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="wish">
<a class="skip" href="#main">跳到主要內容</a>

<script src="js/site-chrome.js"></script>

<main id="main">
<!-- 資料：依網址 ?id= 讀取願望與提案，由 js/wish.js 填入 data-slot。
     · 公開的願望與提案：public_wishes／public_proposals（訪客也能看）
     · 登入的人另外讀 arch_wish_me：是不是許願者（含聯絡方式、選了誰、待審核／未通過的願望）、我的提案
     · 右側欄依身分換內容：許願者／已上架畫家（提案表單或自己的提案）／已登入但不是已上架畫家／訪客
     data-state：loading 載入中／ready 顯示內容／missing 找不到這個願望／error 讀取失敗，一次只顯示一個 -->
<section class="band band--tight">
  <div class="shell">
    <div data-state="loading">
      <div class="wish-detail skel" aria-hidden="true">
        <div><span class="skel-line skel-line--short"></span><span class="skel-line skel-line--title"></span><span class="skel-line"></span><span class="skel-line"></span><span class="skel-line skel-line--mid"></span></div>
        <div class="aside-card"><span class="skel-line skel-line--mid"></span><span class="skel-line"></span><span class="skel-line skel-line--short"></span></div>
      </div>
      <p class="visually-hidden" role="status">正在載入願望…</p>
    </div>

    <!-- 找不到（id 打錯、還沒公開、未通過） -->
    <div class="not-found" data-state="missing" hidden>
      <h1>找不到這個願望</h1>
      <p>可能是網址打錯了，或這個願望還在審核、暫時沒有公開。可以回許願牆看看其他願望。</p>
      <div class="btn-row"><a class="btn" href="wishes.html">回許願牆</a><a class="btn btn--ghost" href="index.html">回首頁</a></div>
    </div>

    <!-- 讀取失敗 -->
    <div class="not-found" data-state="error" role="alert" hidden>
      <h1>願望沒有順利載入</h1>
      <p data-slot="error-msg">請檢查網路後再試一次。</p>
      <div class="btn-row"><button class="btn" type="button" data-action="reload">重新整理</button><a class="btn btn--ghost" href="wishes.html">回許願牆</a></div>
    </div>

    <div data-state="ready" hidden>
      <nav aria-label="目前位置">
        <ol class="crumbs">
          <li><a href="wishes.html">許願牆</a></li>
          <li aria-current="page" data-slot="crumb">願望</li>
        </ol>
      </nav>

      <div class="wish-detail">
        <div>
          <!-- 許願者本人看自己待審核／未通過的願望時，上面多一段說明 -->
          <div data-slot="owner-notice"></div>
          <div class="wish-badges" data-slot="badges"></div>
          <div data-slot="tags"></div>
          <h1 class="wish-h1" data-slot="title"></h1>
          <blockquote class="wish-quote" data-slot="story"></blockquote>
          <div data-slot="facts"></div>
          <p class="wish-by" data-slot="by"></p>

          <section class="wish-intro" data-slot="intro-box" aria-labelledby="t-intro" hidden>
            <h2 id="t-intro">關於許願者</h2>
            <p data-slot="intro"></p>
          </section>

          <section class="wish-proposals" aria-labelledby="t-props">
            <h2 id="t-props">畫家提案<span data-slot="prop-count"></span></h2>
            <div class="proposals" data-slot="proposals"></div>
          </section>
        </div>

        <!-- 右側欄：js/wish.js 依身分填入 -->
        <aside data-slot="aside" aria-label="提案與管理"></aside>
      </div>
    </div>
  </div>
</section>

<!-- 確認對話框（選擇提案、結束徵求、刪除提案共用） -->
<dialog class="dialog dialog--sm" id="confirm-dialog" aria-labelledby="confirm-title">
  <div class="dialog-head">
    <h2 id="confirm-title" data-slot="confirm-title">確定嗎？</h2>
    <button class="close-btn" type="button" data-close aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="dialog-body confirm-body" data-slot="confirm-text"></div>
  <div class="form-actions">
    <button class="btn btn--ghost" type="button" data-close>取消</button>
    <button class="btn" type="button" data-slot="confirm-ok">確定</button>
  </div>
</dialog>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/images.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/cards.js"></script>
<script src="js/wish.js"></script>
</body>
</html>
