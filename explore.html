<section class="ex-stage" aria-labelledby="ex-title">
  <div class="shell ex-head">
    <h1 id="ex-title">作品探索</h1>
    <p class="ex-lede" id="ex-lede">每幅畫都照真實尺寸的比例排列，大畫就大、小畫就小。</p>

  </div>
  <div class="shell ex-foot">
    <div class="ex-foot-info">
      <p class="ex-scale" id="ex-scale" hidden><span class="ex-scale-bar" id="ex-scale-bar"></span><span id="ex-scale-txt"></span></p>
      <p class="ex-hint" id="ex-hint" hidden>往左滑看下一幅</p>

    <div class="ex-actions">

    </div>
  </div>
  <p class="visually-hidden" id="ex-live" aria-live="polite"></p>
</section>
