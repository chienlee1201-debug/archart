<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作品探索｜Arch</title>
<meta name="description" content="照真實尺寸比例排列的作品牆：隨機看 10 幅台灣獨立畫家的原作，大畫就大、小畫就小。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/explore.css">
</head>
<body data-page="explore">
<a class="skip" href="#main">跳到主要內容</a>

<script src="js/site-chrome.js"></script>

<main id="main" class="ex-main">
<!-- 作品探索：桌機／平板是照真實尺寸比例排的展覽牆（隨機 10 幅）；手機一次一幅、左右滑。
     內容由 js/explore.js 產生；資料來自資料庫（已上架畫家、有寬高的作品），見該檔的 getWorks() -->
<section class="ex-stage" aria-labelledby="ex-title">
  <div class="shell ex-head">
    <h1 id="ex-title">作品探索</h1>
    <p class="ex-lede" id="ex-lede">每幅畫都照真實尺寸的比例排列，大畫就大、小畫就小。</p>
  </div>
  <div class="shell ex-bodywrap">
    <div class="ex-body" id="ex-body">
      <div class="ex-msg" role="status">正在載入作品…</div>
      <noscript><p class="muted">這一頁需要開啟 JavaScript。也可以到<a class="link" href="artists.html?view=works">找畫家</a>看全部作品。</p></noscript>
    </div>
  </div>
  <div class="shell ex-foot">
    <div class="ex-foot-info">
      <p class="ex-scale" id="ex-scale" hidden><span class="ex-scale-bar" id="ex-scale-bar"></span><span id="ex-scale-txt"></span></p>
      <p class="ex-hint" id="ex-hint" hidden>往左滑看下一幅</p>
    </div>
    <div class="ex-actions">
      <button class="btn btn--ghost ex-prev" id="ex-prev" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>上一幅</button>
      <button class="btn ex-next" id="ex-next" type="button" hidden><svg class="ex-ico-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span id="ex-next-txt">重新推薦</span><svg class="ex-ico-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
  <p class="visually-hidden" id="ex-live" aria-live="polite"></p>
</section>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/images.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/explore.js"></script>
</body>
</html>
